name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  test:
    name: Train, lint and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx flake8

      - name: Check for syntax errors and undefined names
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Train models from raw data
        run: |
          python training/preprocess_data.py
          python training/train.py

      - name: Run tests
        run: python -m pytest -v

      - name: Save trained models for the Docker build
        uses: actions/upload-artifact@v4
        with:
          name: models
          path: models/

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Get trained models from the test job
        uses: actions/download-artifact@v4
        with:
          name: models
          path: models/

      - name: Build Docker image
        run: docker build -t ml-saas-churn .
